<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MessageStats</title>
<style>
/* Palette: validated categorical set, both modes. Light mode's aqua/yellow/
   magenta sit under 3:1 on the surface, so every series is direct-labelled and
   every chart has a table underneath — the relief rule, not an oversight. */
:root {
  color-scheme: light;
  --surface: #fcfcfb; --page: #f9f9f7;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,.10);
  --warn: #fab219; --crit: #d03b3b; --good: #0ca30c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --seq-lo:#cde2fb; --seq-mid:#3987e5; --seq-hi:#2a78d6;
  /* Shape and depth live here so light and dark share one set of curves. */
  --r-card:18px; --r-tile:14px; --r-ctl:11px;
  --lift:0 1px 2px rgba(11,11,11,.04), 0 8px 24px -12px rgba(11,11,11,.18);
  --lift-hi:0 2px 4px rgba(11,11,11,.05), 0 14px 34px -14px rgba(11,11,11,.26);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme=light])) {
    color-scheme: dark;
    --surface:#1a1a19; --page:#0d0d0d;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --seq-lo:#104281; --seq-mid:#2a78d6; --seq-hi:#86b6ef;
  --lift:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  --lift-hi:0 2px 6px rgba(0,0,0,.35), 0 14px 34px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme=dark] {
  color-scheme: dark;
  --surface:#1a1a19; --page:#0d0d0d;
  --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --seq-lo:#104281; --seq-mid:#2a78d6; --seq-hi:#86b6ef;
  --lift:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  --lift-hi:0 2px 6px rgba(0,0,0,.35), 0 14px 34px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--s1)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:26px;letter-spacing:-.02em} h2{font-size:16px} h3{font-size:13px;color:var(--ink-2)}
.wrap{display:grid;grid-template-columns:288px 1fr;min-height:100vh}
@media (max-width:860px){.wrap{grid-template-columns:1fr}#side{position:static;height:auto;max-height:40vh}}

/* sidebar */
#side{background:var(--surface);border-right:1px solid var(--ring);position:sticky;top:0;
  height:100vh;overflow:auto;padding:16px 0}
.brand{padding:0 16px 12px;display:flex;align-items:baseline;gap:8px}
.brand b{font-size:15px}
.brand span{font-size:11px;color:var(--muted);cursor:pointer;border-bottom:1px dotted transparent}
.brand span:hover{color:var(--ink);border-bottom-color:currentColor}
/* Settings is a tool, not a conversation — it sat in the chat list and read as
   one. Pushed out to the header so the list below is chats and nothing else. */
.gear{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--muted);
  font-size:14px;line-height:1;padding:4px 6px;border-radius:6px;align-self:center}
.gear:hover{color:var(--ink);background:var(--ring)}
.gear[aria-current="true"]{color:var(--ink)}
.gear:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in oklab,var(--s1) 22%,transparent)}
.search-box{margin:0 12px 10px}
input,select,button{font:inherit;color:inherit}
input[type=search],input[type=text],input[type=date],select{
  width:100%;padding:8px 12px;border:1px solid var(--ring);border-radius:var(--r-ctl);
  background:var(--page);color:var(--ink);transition:border-color .14s ease, box-shadow .14s ease}
input:focus-visible,select:focus-visible{outline:none;border-color:var(--s1);
  box-shadow:0 0 0 3px color-mix(in oklab,var(--s1) 22%,transparent)}
.chat{display:block;width:calc(100% - 16px);text-align:left;padding:9px 13px;border:0;background:none;
  cursor:pointer;margin:1px 8px;border-radius:12px;transition:background .14s ease, transform .14s ease}
.chat:hover{background:color-mix(in oklab,var(--s1) 8%,transparent);transform:translateX(2px)}
.chat[aria-current=true]{background:color-mix(in oklab,var(--s1) 15%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--s1) 30%,transparent)}
.navlink{margin-bottom:8px;background:color-mix(in oklab,var(--s4) 12%,transparent)}
.navlink:hover{background:color-mix(in oklab,var(--s4) 20%,transparent)}
.chat .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chat .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .c{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.chat .p{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* main */
main{padding:22px 26px 64px;max-width:1080px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r-card);
  padding:18px 20px;margin:16px 0;box-shadow:var(--lift);
  transition:box-shadow .18s ease, transform .18s ease}
.card:hover{box-shadow:var(--lift-hi)}
.card>h2{display:flex;align-items:center;gap:9px}
.card>h2::before{content:"";width:9px;height:9px;border-radius:50%;
  background:var(--accent,var(--s1));flex:0 0 auto}
/* The accent itself is set per card in JS — see card(). */
.head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline}
.sub{color:var(--ink-2);font-size:13px}
.flag{display:flex;gap:9px;padding:11px 13px;border-radius:10px;font-size:13px;margin:10px 0;
  border:1px solid var(--ring);align-items:flex-start;line-height:1.45}
.flag.warn{background:color-mix(in oklab,var(--warn) 12%,var(--surface))}
.flag.info{background:color-mix(in oklab,var(--s1) 9%,var(--surface))}
.flag b{font-weight:650}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px;margin:16px 0}
.tile{border:1px solid var(--ring);border-radius:var(--r-tile);padding:13px 15px;
  background:linear-gradient(155deg,color-mix(in oklab,var(--accent,var(--s1)) 13%,var(--surface)),var(--surface) 78%);
  box-shadow:var(--lift);transition:transform .18s ease, box-shadow .18s ease}
.tile:hover{transform:translateY(-2px);box-shadow:var(--lift-hi)}
.tiles>.tile:nth-child(4n+1){--accent:var(--s1)} .tiles>.tile:nth-child(4n+2){--accent:var(--s3)}
.tiles>.tile:nth-child(4n+3){--accent:var(--s2)} .tiles>.tile:nth-child(4n+4){--accent:var(--s7)}
.tile .v{font-size:23px;font-weight:700;letter-spacing:-.02em}
.tile .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tile .d{font-size:11.5px;color:var(--ink-2);margin-top:2px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:right;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;
  letter-spacing:.04em;padding:0 0 6px;border-bottom:1px solid var(--grid)}
th:first-child,td:first-child{text-align:left}
td{padding:6px 0;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums}
td+td,th+th{padding-left:16px}
td:first-child{font-weight:550}
.swatch{width:9px;height:9px;border-radius:2.5px;display:inline-block;margin-right:7px;vertical-align:middle}
.legend{display:flex;flex-wrap:wrap;gap:5px 14px;margin:2px 0 10px;font-size:12px;color:var(--ink-2)}
.bars{display:grid;gap:2px}
.brow{display:grid;grid-template-columns:44px 58px 1fr;gap:8px;align-items:center;font-size:12px}
.brow .lab{color:var(--ink-2);font-variant-numeric:tabular-nums}
.brow .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.brow .bar{height:12px;border-radius:0 999px 999px 0;background:var(--seq-mid);
  transition:filter .14s ease}
.brow:hover .bar{filter:brightness(1.12)}
.chip{display:inline-block;padding:3px 11px;border-radius:999px;
  border:1px solid color-mix(in oklab,var(--accent,var(--s1)) 22%,var(--ring));
  background:color-mix(in oklab,var(--accent,var(--s1)) 9%,var(--surface));
  font-size:12px;margin:0 5px 6px 0;transition:transform .12s ease}
.chip:hover{transform:translateY(-1px)}
.msg{padding:6px 0;border-bottom:1px solid var(--grid)}
.msg .m-h{font-size:11.5px;color:var(--muted)}
.msg .m-t{white-space:pre-wrap;word-break:break-word}
.msg.hit{background:color-mix(in oklab,var(--s4) 16%,transparent);border-radius:6px;padding:6px 8px}
.ctx{opacity:.62;font-size:12.5px}
button.act{padding:9px 16px;border-radius:999px;border:1px solid var(--ring);background:var(--surface);
  cursor:pointer;font-weight:600;box-shadow:var(--lift);
  transition:transform .14s ease, box-shadow .14s ease, background .14s ease}
button.act:hover{background:color-mix(in oklab,var(--s1) 10%,var(--surface));transform:translateY(-1px);
  box-shadow:var(--lift-hi)}
button.act:active{transform:translateY(0) scale(.97)}
button.act.primary{background:var(--s1);border-color:var(--s1);color:#fff}
button.act.primary:hover{background:color-mix(in oklab,var(--s1) 88%,#fff)}
.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
/* inputs default to width:100%; inside a row they should share the line */
.row>input,.row>select{width:auto;flex:0 1 auto}
.row>input[type=search],.row>input[type=text]{flex:1 1 200px;min-width:160px}
.steps{counter-reset:s;list-style:none;padding:0;margin:14px 0}
.steps li{counter-increment:s;position:relative;padding:0 0 16px 38px;line-height:1.55}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:25px;height:25px;
  border-radius:50%;background:var(--s1);color:#fff;display:grid;place-items:center;
  font-size:12.5px;font-weight:650}
code,kbd{background:var(--page);border:1px solid var(--ring);border-radius:5px;padding:1px 6px;
  font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
svg{display:block;max-width:100%;overflow:visible}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--ring);
  border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:0 6px 22px rgba(0,0,0,.16);
  z-index:9;opacity:0;transition:opacity .1s}
.scroll{overflow-x:auto}
.clickrow{cursor:pointer}
.clickrow:hover td{background:color-mix(in oklab,var(--s1) 8%,transparent)}
/* The attachment mix is prose, not a number — it should read left to right,
   and its header has to agree with it. */
td.mixcell,th.mixcell{text-align:left;font-variant-numeric:normal}
td.mixcell{color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
  .card:hover,.tile:hover,.chip:hover,.chat:hover,button.act:hover{transform:none}
}
details>summary{cursor:pointer;color:var(--ink-2);font-size:12.5px;padding:5px 0}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <aside id="side">
    <div class="brand"><b>MessageStats</b><span id="brand-sub">local only</span>
      <button id="setbtn" class="gear" title="Settings" aria-label="Settings">⚙</button></div>
    <div class="search-box"><input type="search" id="filter" placeholder="Filter conversations…" autocomplete="off"></div>
    <button class="chat navlink" id="ovbtn">
      <div class="t"><span class="n">✨ Everything</span></div>
      <div class="p">every conversation at once</div>
    </button>
    <div id="chatlist"></div>
  </aside>
  <main id="main"><p class="muted">Loading…</p></main>
</div>
<div class="tip" id="tip"></div>

<script type="module">
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,a={},...k)=>{const n=document.createElement(t);
  for(const[p,v]of Object.entries(a)){ if(p==="class")n.className=v; else if(p==="html")n.innerHTML=v;
    else if(p.startsWith("on"))n.addEventListener(p.slice(2),v); else if(v!=null)n.setAttribute(p,v);}
  for(const c of k.flat()) if(c!=null) n.append(c.nodeType?c:document.createTextNode(c));
  return n;};
const api = async (u)=>{const r=await fetch(u); if(!r.ok) throw new Error((await r.json()).error||r.status); return r.json();};
const N = n=>(n??0).toLocaleString();
const pct = (a,b)=> b? (a/b*100).toFixed(1)+"%" : "—";
const D = ms => new Date(ms).toISOString().slice(0,10);
const DT = ms => new Date(ms).toISOString().slice(0,16).replace("T"," ");
const SIZE = b=> b>=1e9? (b/1e9).toFixed(1)+" GB" : b>=1e6? Math.round(b/1e6)+" MB" : Math.round(b/1e3)+" KB";
const dur = ms=>{const s=Math.round(ms/1000); if(s<60)return s+"s"; const m=Math.round(s/60);
  if(m<60)return m+"m"; const h=Math.floor(m/60); if(h<48)return `${h}h ${m%60}m`; return `${Math.floor(h/24)}d ${h%24}h`;};
const esc = s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
const color = i => `var(${SERIES[i%8]})`;
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

/* ---------- tooltip ---------- */
const tip=$("#tip");
function showTip(e,html){tip.innerHTML=html;tip.style.opacity="1";
  const r=tip.getBoundingClientRect();
  tip.style.left=Math.min(innerWidth-r.width-8,e.clientX+13)+"px";
  tip.style.top=Math.max(8,e.clientY-r.height-11)+"px";}
const hideTip=()=>tip.style.opacity="0";

/* ---------- charts (inline SVG, no library) ---------- */
const NS="http://www.w3.org/2000/svg";
const sv=(t,a)=>{const n=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a||{}))
  if(v!=null)n.setAttribute(k,v);return n;};

/** Bars for a labelled series. Thin marks, 4px rounded end at the data side. */
function barRows(items,{max,fmt=N,colorOf=()=>"var(--seq-mid)"}={}){
  const hi = max ?? Math.max(...items.map(i=>i.v),1);
  const box = el("div",{class:"bars"});
  for(const it of items){
    const w = hi? Math.max(it.v>0?2:0, it.v/hi*100):0;
    const bar = el("div",{class:"bar"});
    bar.style.width=w+"%"; bar.style.background=colorOf(it);
    const row = el("div",{class:"brow"},
      el("span",{class:"lab"},it.k), el("span",{class:"num"},fmt(it.v)), bar);
    row.addEventListener("mousemove",e=>showTip(e,`<b>${esc(it.k)}</b> · ${fmt(it.v)}`));
    row.addEventListener("mouseleave",hideTip);
    box.append(row);
  }
  return box;
}

/** Multi-series line chart with a crosshair. Series are direct-labelled. */
function lineChart(labels,series,{h=190,fmt=N,yLabel=""}={}){
  const w=760,padL=44,padR=96,padT=12,padB=26;
  const hi=Math.max(1,...series.flatMap(s=>s.values));
  const x=i=>padL+(labels.length<2?0:i*(w-padL-padR)/(labels.length-1));
  const y=v=>padT+(1-v/hi)*(h-padT-padB);
  const svg=sv("svg",{viewBox:`0 0 ${w} ${h}`,role:"img","aria-label":yLabel||"chart"});
  for(let g=0;g<=4;g++){const yy=padT+g*(h-padT-padB)/4;
    svg.append(sv("line",{x1:padL,x2:w-padR,y1:yy,y2:yy,stroke:"var(--grid)","stroke-width":1}));
    svg.append(Object.assign(sv("text",{x:padL-7,y:yy+4,"text-anchor":"end",fill:"var(--muted)","font-size":10}),
      {textContent:fmt(Math.round(hi*(1-g/4)))}));}
  labels.forEach((l,i)=>{ if(labels.length>12 && i%Math.ceil(labels.length/8)) return;
    svg.append(Object.assign(sv("text",{x:x(i),y:h-8,"text-anchor":"middle",fill:"var(--muted)","font-size":10}),{textContent:l}));});
  series.forEach((s,si)=>{
    const d=s.values.map((v,i)=>`${i?"L":"M"}${x(i)},${y(v)}`).join(" ");
    svg.append(sv("path",{d,fill:"none",stroke:color(si),"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
    s.values.forEach((v,i)=>{ const c=sv("circle",{cx:x(i),cy:y(v),r:4,fill:color(si),
      stroke:"var(--surface)","stroke-width":2}); // 2px surface ring on overlap
      c.addEventListener("mousemove",e=>showTip(e,`<b>${esc(s.name)}</b><br>${esc(labels[i])} · ${fmt(v)}`));
      c.addEventListener("mouseleave",hideTip); svg.append(c);});
  });
  // Direct labels last, after de-colliding them vertically. Series that end
  // close together would otherwise overprint into an unreadable smear — the
  // labels are the accessibility channel here, so they have to stay legible.
  const LINE=12;
  const lab=series.map((s,si)=>({name:s.name,si,at:y(s.values[s.values.length-1]),y:0}));
  lab.sort((a,b)=>a.at-b.at);
  lab.forEach((l,i)=>{ l.y = i===0 ? l.at : Math.max(l.at, lab[i-1].y+LINE); });
  // If pushing down overflowed the plot, pull the whole stack back up.
  const over=lab.length? lab[lab.length-1].y-(h-padB) : 0;
  if(over>0) for(const l of lab) l.y-=over;
  for(const l of lab){
    if(Math.abs(l.y-l.at)>2) // moved: draw a hairline back to its line end
      svg.append(sv("line",{x1:x(labels.length-1)+3,y1:l.at,x2:x(labels.length-1)+7,y2:l.y-3,
        stroke:"var(--axis)","stroke-width":1}));
    svg.append(Object.assign(sv("text",{x:x(labels.length-1)+9,y:l.y,fill:"var(--ink-2)","font-size":11}),
      {textContent:l.name}));
  }
  return svg;
}

/** Single-series area over time. Sequential blue. */
let gradSeq=0;
function areaChart(labels,values,{h=150,fmt=N}={}){
  const w=760,padL=44,padR=12,padT=12,padB=24;
  const hi=Math.max(1,...values);
  const x=i=>padL+(values.length<2?0:i*(w-padL-padR)/(values.length-1));
  const y=v=>padT+(1-v/hi)*(h-padT-padB);
  const svg=sv("svg",{viewBox:`0 0 ${w} ${h}`,role:"img","aria-label":"messages over time"});
  // Unique per chart — two area charts on one page would otherwise share an id
  // and the second would paint itself with the first one's gradient.
  const gid=`ag${++gradSeq}`;
  const grad=sv("linearGradient",{id:gid,x1:0,y1:0,x2:0,y2:1});
  grad.append(sv("stop",{offset:"0%","stop-color":"var(--seq-mid)","stop-opacity":.34}));
  grad.append(sv("stop",{offset:"100%","stop-color":"var(--seq-mid)","stop-opacity":.02}));
  const defs=sv("defs",{});           // append() returns undefined — don't chain
  defs.append(grad);
  svg.append(defs);
  for(let g=0;g<=3;g++){const yy=padT+g*(h-padT-padB)/3;
    svg.append(sv("line",{x1:padL,x2:w-padR,y1:yy,y2:yy,stroke:"var(--grid)","stroke-width":1}));
    svg.append(Object.assign(sv("text",{x:padL-7,y:yy+4,"text-anchor":"end",fill:"var(--muted)","font-size":10}),
      {textContent:fmt(Math.round(hi*(1-g/3)))}));}
  const line=values.map((v,i)=>`${i?"L":"M"}${x(i)},${y(v)}`).join(" ");
  svg.append(sv("path",{d:`${line} L${x(values.length-1)},${y(0)} L${x(0)},${y(0)} Z`,fill:`url(#${gid})`,stroke:"none"}));
  svg.append(sv("path",{d:line,fill:"none",stroke:"var(--seq-mid)","stroke-width":2,"stroke-linejoin":"round"}));
  labels.forEach((l,i)=>{ if(i%Math.ceil(labels.length/9)) return;
    svg.append(Object.assign(sv("text",{x:x(i),y:h-6,"text-anchor":"middle",fill:"var(--muted)","font-size":10}),{textContent:l}));});
  const hit=sv("rect",{x:padL,y:padT,width:w-padL-padR,height:h-padT-padB,fill:"transparent"});
  const cross=sv("line",{y1:padT,y2:h-padB,stroke:"var(--axis)","stroke-width":1,opacity:0});
  hit.addEventListener("mousemove",e=>{const b=svg.getBoundingClientRect();
    const rel=(e.clientX-b.left)/b.width*w; let i=Math.round((rel-padL)/((w-padL-padR)/Math.max(1,values.length-1)));
    i=Math.max(0,Math.min(values.length-1,i));
    cross.setAttribute("x1",x(i));cross.setAttribute("x2",x(i));cross.setAttribute("opacity",1);
    showTip(e,`<b>${esc(labels[i])}</b> · ${fmt(values[i])}`);});
  hit.addEventListener("mouseleave",()=>{cross.setAttribute("opacity",0);hideTip();});
  svg.append(cross,hit);
  return svg;
}

/* ---------- state ---------- */
let CHATS=[], CUR=null, OPT={merge:false,ids:[]};
/* Bumped every time #main is rebuilt. Anything that awaits before touching the
   DOM captures it first and gives up if the page moved on underneath — the
   overview takes seconds to compute, and a click during that window used to
   drop it underneath whatever you opened instead. */
let PAGE=0;
const newPage=()=>++PAGE;

/* Preferences live in the browser, not on disk: they change how this page
   behaves, not what the numbers are. The WKWebView keeps its own localStorage,
   so they persist across launches of the app. */
const PREF_DEFAULTS = { autoMerge:false, aiTone:"funny" };
const PREFS = {
  all(){ try { return {...PREF_DEFAULTS, ...JSON.parse(localStorage.getItem("messagestats.prefs")||"{}")}; }
         catch { return {...PREF_DEFAULTS}; } },
  get(k){ return this.all()[k]; },
  set(k,v){ const a=this.all(); a[k]=v; localStorage.setItem("messagestats.prefs",JSON.stringify(a)); },
};

/* ---------- setup wizard ---------- */
const MB = b => b==null? "?" : (b/1e6>=1000? (b/1e9).toFixed(2)+" GB" : Math.round(b/1e6)+" MB");

/**
 * The first-run wizard, and — with {refresh:true} — the way back to it.
 *
 * Without a refresh mode this screen is a one-way door: once a database and a
 * names.json both exist, boot() never routes here again, so there is no way to
 * re-copy a snapshot that has gone stale or to re-read Contacts after adding
 * someone. In refresh mode every card is shown regardless of what already
 * exists, and nothing auto-advances.
 */
async function renderSetup(st,{refresh=false}={}){
  const m=$("#main"); m.innerHTML=""; newPage();
  m.append(el("h1",{},refresh?"Refresh your data":"Let's find your messages"));
  m.append(el("p",{class:"sub"},refresh
    ? "Re-copy the snapshot, or re-read Contacts after adding someone. The old copy is replaced in place — your notes and settings live elsewhere and aren't touched."
    : "Everything happens on this machine. This page is served from 127.0.0.1 and the project has no network client in it at all."));
  if(refresh) m.append(el("div",{class:"row",style:"margin-bottom:14px"},
    el("button",{class:"act",onclick:()=>boot(true)},"← Back to conversations")));
  if(!st.db.found || refresh){
    const src=await api("/api/source");
    if(src.readable){
      // We can read the live folder, so do the copying for them.
      const total=src.parts.reduce((s,p)=>s+(p.bytes||0),0);
      const card1=el("div",{class:"card"},
        el("h2",{},"Found your Messages folder"),
        el("p",{class:"sub"},src.dir," · ",src.parts.map(p=>`${p.name} ${MB(p.bytes)}`).join(" · ")),
        el("p",{},"I can copy a snapshot here for you — no Finder required. It's ",el("b",{},MB(total)),", so give it a few seconds."));
      if(src.messagesRunning) card1.append(el("div",{class:"flag warn"},el("div",{},
        el("b",{},"Quit Messages first (⌘Q). "),
        "It's running right now, which means the newest messages are sitting unflushed in the write-ahead log. Copying now still works, but the last little while of history may be missing.")));
      const status=el("p",{class:"sub"});
      card1.append(el("div",{class:"row"},
        el("button",{class:"act primary",onclick:async ev=>{
          ev.target.disabled=true; ev.target.textContent="Copying…";
          status.textContent="Copying "+MB(total)+" — this is the slow part.";
          try{
            const r=await fetch("/api/import",{method:"POST"}).then(r=>r.json());
            if(!r.ok) throw new Error(r.detail||r.error);
            status.textContent="Copied "+r.copied.map(c=>c.name).join(", ")+".";
            boot();
          }catch(e){ status.textContent="Failed: "+e.message; ev.target.disabled=false; ev.target.textContent="Try again"; }
        }},"Copy snapshot now"),
        el("button",{class:"act",onclick:()=>{card1.after(manualCard());}},"I'd rather copy it myself")),
        status);
      m.append(card1);
    } else {
      const fdaStatus=el("p",{class:"sub"});
      m.append(el("div",{class:"card"},
        el("h2",{},"macOS won't let me read your Messages folder"),
        el("p",{},"That folder is protected, and there's no way for a program to ask for permission — you have to grant it by hand. Two options:"),
        el("h3",{style:"margin-top:14px"},"Option A — grant Full Disk Access, then I'll do the copying"),
        el("ol",{class:"steps"},
          el("li",{},"Open ",el("b",{},"Full Disk Access"),
            el("div",{class:"sub"},"The button below jumps straight there. By hand it's System Settings → Privacy & Security → Full Disk Access.")),
          el("li",{},"Switch on ",el("b",{},"MessageStats"),
            el("div",{class:"sub"},"If you started the server yourself with ",el("code",{},"node serve.mjs"),", add the terminal app you ran it from instead.")),
          el("li",{},el("b",{},"Fully quit MessageStats and open it again"),
            el("div",{class:"sub"},"The permission only applies to a freshly launched process, so a reload isn't enough.")),
          el("li",{},"Come back to this page")),
        el("div",{class:"row"},
          el("button",{class:"act",onclick:async ev=>{
            const b=ev.target; b.disabled=true;
            try{
              const r=await fetch("/api/open-privacy",{method:"POST"}).then(r=>r.json());
              if(!r.ok) throw new Error(r.error||"could not open System Settings");
              fdaStatus.textContent="Opened System Settings — switch on MessageStats, then quit and reopen it.";
            }catch(e){ fdaStatus.textContent="Couldn't open it: "+e.message+" — use the path in step 1 instead."; }
            b.disabled=false;
          }},"Open Full Disk Access settings"),
          el("button",{class:"act primary",onclick:()=>boot()},"I've done that — recheck")),
        fdaStatus));
      m.append(manualCard());
    }
    if(!refresh){
      m.append(el("div",{class:"flag info"},el("div",{},
        el("b",{},"Why a copy at all? "),
        "The live database is being written to while Messages runs, so reading it directly gives inconsistent results. A snapshot is also safer: nothing this tool does can ever touch your real history.")));
      return;
    }
  }
  if(st.db.found) m.append(el("div",{class:"card"},
    el("h2",{},"Database found"),
    el("p",{class:"sub"},`${st.db.path} · ${N(st.db.sizeMB)} MB${st.db.wal?" · WAL present ✓":" · no -wal file, recent messages may be missing"}`),
    st.db.ageHours!=null? el("p",{class:"sub"},
      `Newest message ${DT(st.db.newest)} — ${st.db.ageHours<24?st.db.ageHours.toFixed(1)+"h old":Math.round(st.db.ageHours/24)+" days old"}`):null));
  if(!st.names.found || st.names.count===0 || refresh){
    m.append(el("div",{class:"card"},
      el("h2",{},refresh?"Re-read Contacts":"2. Put names to the numbers"),
      el("p",{class:"sub"},refresh
        ? `${N(st.names.count)} names on file${st.names.unnamedTotal?`, ${N(st.names.unnamedTotal)} handles still unnamed`:""}. Run this again after adding someone to Contacts — existing entries are kept.`
        : "chat.db stores phone numbers, not names — those live in Contacts, which this tool reads only when you ask. Without this, every report is a wall of phone numbers."),
      el("div",{class:"row"},
        el("button",{class:"act primary",onclick:async ev=>{
          ev.target.disabled=true; ev.target.textContent="Reading Contacts…";
          const r=await fetch("/api/build-names",{method:"POST"}).then(r=>r.json());
          alert(r.output||"done"); boot();
        }},refresh?"Re-read Contacts now":"Build names from Contacts"),
        refresh?null:el("button",{class:"act",onclick:()=>boot(true)},"Skip for now"))));
    if(!refresh) return;
  }
  if(!refresh) boot(true);
}

/* ---------- sidebar ---------- */
function renderChats(list){
  const box=$("#chatlist"); box.innerHTML="";
  for(const c of list){
    const b=el("button",{class:"chat",onclick:()=>openChat(c.id)},
      el("div",{class:"t"},el("span",{class:"n"},c.name),el("span",{class:"c"},N(c.n))),
      el("div",{class:"p"},c.isGroup? c.people.join(", ") : D(c.first)+" → "+D(c.last)));
    if(c.siblings.length) b.append(el("div",{class:"p"},
      el("span",{style:"color:var(--warn)"},"⚠ "),`split across ${c.siblings.length+1} threads`));
    else if(c.named.length) b.append(el("div",{class:"p"},"? same name, other roster"));
    b.dataset.id=c.id;
    box.append(b);
  }
}
$("#filter").addEventListener("input",e=>{
  const q=e.target.value.toLowerCase();
  renderChats(CHATS.filter(c=>(c.name+" "+c.people.join(" ")).toLowerCase().includes(q)));
});

/* ---------- chat detail ---------- */
async function openChat(id,opt){
  // merge:true folds sibling threads only — same people, different
  // chat_identifier. Same-name-different-roster threads are never folded
  // automatically, here or anywhere: a work group with staff churn and a chat
  // that deliberately excludes someone are indistinguishable in the schema.
  if(opt) OPT=opt; else OPT={merge:PREFS.get("autoMerge"),ids:[]};
  newPage();
  CUR=id;
  for(const b of document.querySelectorAll(".chat")) b.setAttribute("aria-current",String(+b.dataset.id===id));
  $("#main").innerHTML='<p class="muted">Reading messages…</p>';
  const qs=new URLSearchParams();
  if(OPT.merge) qs.set("merge","1");
  if(OPT.ids?.length) qs.set("ids",OPT.ids.join(","));
  let A; try{ A=await api(`/api/chat/${id}?${qs}`);}catch(e){ $("#main").innerHTML=`<p class="muted">${esc(e.message)}</p>`; return;}
  if(A.error){ $("#main").innerHTML=`<p class="muted">${esc(A.error)}</p>`; return;}
  render(A);
}

function render(A){
  const m=$("#main"); m.innerHTML=""; resetCards();
  const P=A.perPerson;

  m.append(el("div",{class:"head"},el("h1",{},A.chat.name),
    el("span",{class:"sub"},`${N(A.total)} messages · ${A.people.length} people · ${D(A.first)} → ${D(A.last)}`)));
  if(A.aka?.length) m.append(el("p",{class:"sub"},"also known as ",A.aka.map(n=>`“${n}”`).join(", ")));

  /* merge state */
  if(A.chat.ids.length>1){
    const f=el("div",{class:"flag info"},el("div",{},
      el("b",{},`Merged ${A.chat.ids.length} threads. `),
      A.chat.ids.join(" + ")));
    m.append(f);
    if(A.rostersDiffer){
      const t=el("table",{},el("thead",{},el("tr",{},el("th",{},"thread"),el("th",{},"msgs"),el("th",{},"span"),el("th",{},"roster"))));
      const tb=el("tbody",{});
      for(const th of A.threads) tb.append(el("tr",{},el("td",{},String(th.id)),el("td",{},th.n?N(th.n):"—"),
        el("td",{},th.first?`${D(th.first)} → ${D(th.last)}`:"—"),el("td",{style:"text-align:left"},th.roster.join(", ")||"—")));
      t.append(tb);
      m.append(el("div",{class:"card"},el("h2",{},"Rosters differ across these threads"),
        el("p",{class:"sub"},"Per-person totals span the whole merge, so anyone present for only part of it looks quiet — read the per-year chart. Anyone who left is missing from every roster while their messages remain."),
        el("div",{class:"scroll"},t)));
    }
  } else if(A.siblings?.length){
    const extra=A.siblings.reduce((s,x)=>s+x.n,0);
    const share=extra/(A.total+extra)*100;
    m.append(el("div",{class:"flag warn"},el("div",{},
      el("b",{},`These same people have ${N(extra)} more messages in ${A.siblings.length} other thread(s). `),
      `About ${share<0.05?"<0.1":share.toFixed(1)}% of this conversation is missing from everything below.`,
      el("div",{class:"row",style:"margin-top:8px"},
        el("button",{class:"act",onclick:()=>openChat(A.chat.id,{merge:true,ids:[]})},"Merge them")))));
  }
  if(A.named?.length){
    m.append(el("div",{class:"flag warn"},el("div",{},
      el("b",{},`${A.named.length} thread(s) share this name but have a different roster. `),
      "Could be one group with people joining and leaving — or a chat that deliberately excludes someone. Not merged automatically.",
      el("div",{class:"row",style:"margin-top:8px"},
        el("button",{class:"act",onclick:()=>openChat(A.chat.id,{merge:false,ids:[A.chat.id,...A.named.map(x=>x.id)]})},
          "Treat as one group")))));
  }

  /* tiles */
  const B=A.busiest;
  m.append(el("div",{class:"tiles"},
    tile(N(Math.round(A.perDay)),"per day",`${N(A.spanDays)} days`),
    tile(N(B.day.n),"busiest day",B.day.key),
    tile(N(B.streak.days),"day streak",`${B.streak.start} → ${B.streak.end}`),
    tile(pct(B.activeDays,A.spanDays),"days active",`${N(B.activeDays)} of ${N(A.spanDays)}`),
    B.silence? tile(dur(B.silence.ms),"longest gap","after "+B.silence.after.who):null,
    A.tapbacks? tile((A.tapbacks.total/A.total).toFixed(2),"tapbacks / msg",N(A.tapbacks.total)+" total"):null));

  /* volume over time */
  const months=Object.keys(A.rhythm.byMonth).sort();
  m.append(card("Messages over time",
    areaChart(months,months.map(k=>A.rhythm.byMonth[k])),
    "Monthly totals. Hover for the value."));

  /* per person */
  const yrs=A.years;
  const series=P.slice(0,8).map(p=>({name:p.who,values:yrs.map(y=>p.byYear[y]??0)}));
  const c1=card("Who talks, by year",lineChart(yrs.map(String),series,{yLabel:"messages per year"}));
  c1.append(legend(P.slice(0,8).map((p,i)=>({name:p.who,i}))));
  c1.append(personTable(P,A));
  m.append(c1);

  /* rhythm */
  const hours=A.rhythm.hours;
  m.append(card("When they talk",
    el("div",{},
      barRows(hours.map((v,h)=>({k:String(h).padStart(2,"0")+":00",v})),{}),
      el("h3",{style:"margin:14px 0 6px"},"Day of week"),
      barRows(A.rhythm.dow.map((v,d)=>({k:DOW[d],v})),{}))));

  /* dynamics */
  const dt=el("table",{},el("thead",{},el("tr",{},el("th",{},"person"),el("th",{},"starts"),el("th",{},"last word"),
    el("th",{},"median reply"),el("th",{},"double-texts"),el("th",{},"avg len"))));
  const dtb=el("tbody",{});
  P.forEach((p,i)=>dtb.append(el("tr",{},
    el("td",{},el("span",{class:"swatch",style:`background:${color(i)}`}),p.who),
    el("td",{},N(p.starts)),el("td",{},N(p.lastWord)),el("td",{},dur(p.medianReply)),
    el("td",{},`${N(p.doubles)} (${pct(p.doubles,p.n)})`),el("td",{},p.avgLen.toFixed(1)))));
  dt.append(dtb);
  const D2=A.dynamics;
  const cd=card("Conversation dynamics",el("div",{class:"scroll"},dt),
    `“starts” = first message after ${D2.gapHours}h of silence.`);
  cd.append(el("p",{class:"sub"},`Longest monologue: ${D2.monologue.n} in a row by ${D2.monologue.who}, ${D(D2.monologue.at)}.`));
  if(D2.fastest) cd.append(el("p",{class:"sub"},
    `Fastest reply: ${(D2.fastest.ms/1000).toFixed(1)}s — ${D2.fastest.reply.who} to ${D2.fastest.to.who}, ${D(D2.fastest.reply.ms)}.`));
  m.append(cd);

  /* tapbacks */
  if(A.tapbacks){
    const tt=el("table",{},el("thead",{},el("tr",{},el("th",{},"person"),el("th",{},"given"),el("th",{},"got"),
      el("th",{},"ratio"),el("th",{},"per msg"))));
    const ttb=el("tbody",{});
    P.forEach((p,i)=>ttb.append(el("tr",{},
      el("td",{},el("span",{class:"swatch",style:`background:${color(i)}`}),p.who),
      el("td",{},N(p.given)),el("td",{},N(p.received)),
      el("td",{},p.received?(p.given/p.received).toFixed(2):"—"),el("td",{},(p.received/p.n).toFixed(3)))));
    tt.append(ttb);
    const ct=card("Tapbacks",el("div",{},
      el("p",{class:"sub"},A.tapbacks.kinds.map(k=>`${k.kind} ${N(k.n)}`).join(" · ")),
      el("div",{class:"scroll"},tt)),"Ratio under 1.00 means they receive more than they give.");
    if(A.tapbacks.mostReacted.length){
      ct.append(el("h3",{style:"margin:12px 0 4px"},"Most-reacted messages"));
      for(const r of A.tapbacks.mostReacted)
        ct.append(el("div",{class:"msg"},el("div",{class:"m-h"},`${r.n}× · ${r.msg.who} · ${D(r.msg.ms)}`),
          el("div",{class:"m-t"},r.msg.text.slice(0,180))));
    }
    m.append(ct);
  }

  /* words */
  const cw=card("Signature words",el("p",{class:"sub"},
    `Said far more than everyone else does — min ${A.signature.minUses} uses. This is the section that actually characterises people.`));
  for(const s of A.signature.people){
    const i=P.findIndex(p=>p.who===s.who);
    cw.append(el("h3",{style:"margin:10px 0 4px"},el("span",{class:"swatch",style:`background:${color(i)}`}),s.who));
    cw.append(el("div",{},s.words.map(w=>el("span",{class:"chip"},`${w.word} ${w.n}× ${w.ratio==null?"only them":w.ratio.toFixed(1)+"x"}`))));
  }
  cw.append(el("details",{},el("summary",{},"Most-used words (raw counts)"),
    ...P.map((p,i)=>el("div",{style:"margin:6px 0"},
      el("h3",{},el("span",{class:"swatch",style:`background:${color(i)}`}),p.who),
      el("div",{class:"sub"},p.topWords.map(w=>`${w.word} (${N(w.n)})`).join(", "))))));
  m.append(cw);

  /* words that arrived partway through */
  if(A.pickedUp){
    const cp=card("Words they picked up",el("p",{class:"sub"},
      `Not there at the start, a habit by the end — first used at least a fifth of the way in, then ${A.pickedUp.minUses}+ times. A different question from signature words: this one is about drift.`));
    for(const s of A.pickedUp.people){
      const i=P.findIndex(p=>p.who===s.who);
      cp.append(el("h3",{style:"margin:10px 0 4px"},el("span",{class:"swatch",style:`background:${color(i)}`}),s.who));
      cp.append(el("div",{},s.words.map(w=>el("span",{class:"chip"},`${w.word} ${w.n}× from ${D(w.at)}`))));
    }
    m.append(cp);
  }

  /* attachments */
  if(A.attachments && (A.attachments.total || A.attachments.linkCards)){
    const ca=card("Attachments",null,
      A.attachments.total? `${N(A.attachments.total)} files, ${SIZE(A.attachments.bytes)} in total.` : null);
    if(A.attachments.total){
      const at=el("table",{},el("thead",{},el("tr",{},el("th",{},"person"),el("th",{},"files"),
        el("th",{},"size"),el("th",{class:"mixcell"},"what"))));
      const atb=el("tbody",{});
      P.forEach((p,i)=>{ if(!p.attachments) return; atb.append(el("tr",{},
        el("td",{},el("span",{class:"swatch",style:`background:${color(i)}`}),p.who),
        el("td",{},N(p.attachments)),el("td",{},SIZE(p.attachmentBytes)),
        el("td",{class:"mixcell"},p.attachmentKinds.map(k=>`${k.kind} ${k.n}`).join(", ")))); });
      at.append(atb);
      ca.append(el("div",{class:"scroll"},at));
      const yrs=Object.entries(A.attachments.byYear);
      if(yrs.length>1){
        ca.append(el("h3",{style:"margin:14px 0 6px"},"Files per year"));
        ca.append(barRows(yrs.map(([y,n])=>({k:y,v:n}))));
      }
    }
    // The single biggest artifact in this whole report — see analyze.mjs.
    if(A.attachments.linkCards) ca.append(el("div",{class:"flag info"},el("div",{},
      el("b",{},`Plus ${N(A.attachments.linkCards)} link preview cards. `),
      "iMessage builds those automatically whenever someone pastes a URL, so they are left out of every number above. Counted as files, whoever shares the most articles would look like the biggest photographer.")));
    m.append(ca);
  }

  /* unsent + edited */
  if(A.edits){
    const et=el("table",{},el("thead",{},el("tr",{},el("th",{},"person"),el("th",{},"unsent"),el("th",{},"edited"))));
    const etb=el("tbody",{});
    P.forEach((p,i)=>{ if(!p.unsent&&!p.edited) return; etb.append(el("tr",{},
      el("td",{},el("span",{class:"swatch",style:`background:${color(i)}`}),p.who),
      el("td",{},N(p.unsent)),el("td",{},N(p.edited)))); });
    et.append(etb);
    const ce2=card("Second thoughts",el("div",{class:"scroll"},et),
      "Messages taken back or rewritten after sending.");
    if(!A.edits.unsent) ce2.append(el("p",{class:"sub"},
      "No unsent messages recorded here. macOS only started keeping them in Ventura, and an unsend from before then left nothing behind."));
    m.append(ce2);
  }

  /* read receipts */
  if(A.read){
    const side=(s,label)=>el("div",{class:"tile"},
      el("div",{class:"v"},s? (s.medianMs==null? "—" : dur(s.medianMs)) : "—"),
      el("div",{class:"k"},label),
      el("div",{class:"d"}, !s? "no data"
        : s.medianMs==null? `only ${N(s.n)} sample${s.n===1?"":"s"}` : `${N(s.n)} messages`));
    const cr=card("Read receipts",el("div",{class:"tiles"},
      side(A.read.byThem,"they read yours in"), side(A.read.byMe,"you read theirs in")),
      `Covers ${(A.read.coverage*100).toFixed(0)}% of this conversation.`);
    cr.append(el("p",{class:"sub"},
      "Only counts messages where the reader had read receipts switched on. A dash on one side almost always means that person keeps them off, not that they never read anything."));
    m.append(cr);
  }

  /* emoji + odds */
  if(A.emoji.overall.length){
    const ce=card("Emoji",el("div",{style:"font-size:19px"},A.emoji.overall.map(e=>
      el("span",{class:"chip",style:"font-size:16px"},`${e.emoji} ${e.n}`))));
    for(const [i,p] of P.entries()) if(p.topEmoji.length)
      ce.append(el("p",{class:"sub"},el("span",{class:"swatch",style:`background:${color(i)}`}),p.who+" ",
        p.topEmoji.map(e=>`${e.emoji} ${e.n}`).join("  ")));
    m.append(ce);
  }

  const ot=el("table",{},el("thead",{},el("tr",{},el("th",{},"person"),el("th",{},"laughs"),el("th",{},"asks ?"),
    el("th",{},"shouts"),el("th",{},"links"),el("th",{},"vocab"))));
  const otb=el("tbody",{});
  P.forEach((p,i)=>otb.append(el("tr",{},
    el("td",{},el("span",{class:"swatch",style:`background:${color(i)}`}),p.who),
    el("td",{},pct(p.laughs,p.n)),el("td",{},pct(p.questions,p.n)),el("td",{},N(p.shouts)),
    el("td",{},N(p.links)),el("td",{},N(p.vocab)))));
  ot.append(otb);
  const co=card("Odds and ends",el("div",{class:"scroll"},ot));
  if(A.odds.domains.length) co.append(el("p",{class:"sub"},el("b",{},"Domains: "),
    A.odds.domains.map(d=>`${d.domain} (${N(d.n)})`).join(" · ")));
  co.append(el("p",{class:"sub"},el("b",{},"Most repeated: "),
    A.odds.repeated.map(r=>`“${r.text}” ×${N(r.n)}`).join(" · ")));
  m.append(co);

  /* search + assistant */
  m.append(searchPanel(A));
  m.append(askPanel(A));
}

/**
 * Setup, in the browser. Pick a provider, paste a key, then load the model list
 * FROM the provider — nobody should have to know a model id from memory, and
 * this page should never carry a hardcoded list that goes stale.
 */
function setupForm(cfg){
  const box = el("div",{});
  const prov = el("select",{}, ...cfg.providers.map(p=>
    el("option",{value:p.id},p.label + (p.local?" — nothing leaves this machine":""))));
  prov.value = "anthropic";
  const key  = el("input",{type:"password",placeholder:"API key",autocomplete:"off"});
  const base = el("input",{type:"text",placeholder:"https://your-host/v1"});
  const model= el("select",{},el("option",{value:""},"— load models first —"));
  // Built here, not inside box.append() below: sync() runs during construction
  // and needs these to exist. Reading key.parentElement instead was null at
  // that point, which threw and meant this form never rendered at all.
  const keyWrap  = el("div",{},el("h3",{},"API key"),key);
  const baseWrap = el("div",{style:"flex:1;min-width:200px"},el("h3",{},"Base URL"),base);
  const note = el("p",{class:"sub"});
  const saveBtn = el("button",{class:"act primary"},"Save");
  saveBtn.disabled = true;

  const preset = ()=>cfg.providers.find(p=>p.id===prov.value);
  const sync = ()=>{
    const p = preset();
    keyWrap.style.display  = p.needsKey ? "" : "none";
    baseWrap.style.display = p.id==="custom" ? "" : "none";
    note.textContent = p.local
      ? "Runs on your machine — no key, nothing sent anywhere. Expect weaker analysis than a hosted model."
      : "Statistics for the open conversation get sent to this provider when you ask a question. Every request is logged locally.";
    model.innerHTML=""; model.append(el("option",{value:""},"— load models first —"));
    saveBtn.disabled = true;
  };
  prov.addEventListener("change",sync); sync();

  const load = async (ev)=>{
    ev.target.disabled=true; const was=ev.target.textContent; ev.target.textContent="Loading…";
    try{
      const r = await fetch("/api/ai/models",{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({provider:prov.value,apiKey:key.value||null,baseUrl:base.value||null})}).then(x=>x.json());
      if(r.error) throw new Error(r.error);
      model.innerHTML="";
      for(const m of r.models) model.append(el("option",{value:m},m));
      saveBtn.disabled=false;
      note.textContent = `${r.models.length} models available. Pick the most capable one you're willing to pay for — this is where quality comes from.`;
    }catch(e){ note.textContent = "Couldn't list models: "+e.message; }
    ev.target.disabled=false; ev.target.textContent=was;
  };
  saveBtn.addEventListener("click",async ()=>{
    saveBtn.disabled=true; saveBtn.textContent="Saving…";
    try{
      const r = await fetch("/api/ai/config",{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({provider:prov.value,model:model.value,apiKey:key.value||null,baseUrl:base.value||null})}).then(x=>x.json());
      if(r.error) throw new Error(r.error);
      location.reload();
    }catch(e){ note.textContent="Couldn't save: "+e.message; saveBtn.disabled=false; saveBtn.textContent="Save"; }
  });

  box.append(
    el("p",{class:"sub"},"Off by default — this is the only feature that can send anything off this machine. Bring whatever you already have: ChatGPT, Claude, Gemini, or a local model."),
    el("div",{class:"row",style:"margin:10px 0"},
      el("div",{},el("h3",{},"Provider"),prov), keyWrap, baseWrap),
    el("div",{class:"row"},
      el("button",{class:"act",onclick:load},"Load models"),
      el("div",{style:"flex:1;min-width:220px"},model),
      saveBtn),
    note,
    el("details",{},el("summary",{},"Rather edit a file?"),
      el("pre",{style:"overflow-x:auto"},el("code",{},
`# ~/Library/Application Support/MessageStats/ai.local.json
{ "provider": "anthropic", "model": "claude-opus-5",  "apiKey": "sk-ant-…" }
{ "provider": "openai",    "model": "<from /v1/models>", "apiKey": "sk-…" }
{ "provider": "ollama",    "model": "llama3.1" }`))));
  return box;
}

/**
 * Save an answer as Markdown. Built and downloaded in the page — the server
 * never sees it, which keeps the "nothing leaves this machine" promise intact
 * for the export as much as for the analysis.
 */
function saveAnswer(r,question,secs){
  const stamp=new Date().toISOString().slice(0,16).replace("T"," ");
  const body=[
    `# ${r.chat}`,``,
    `**Question:** ${question}`,
    `**Tone:** ${r.toneLabel}`,
    `**Model:** ${r.provider} · ${r.model}${r.local?" (local)":""}`,
    `**Asked:** ${stamp} · ${secs}s`,
    r.truncated?`\n> Cut off: the model hit its length limit before finishing.`:``,
    ``,`---`,``,r.answer,``,
  ].join("\n");
  const safe=(r.chat||"chat").replace(/[^\w -]+/g,"").trim().slice(0,40)||"chat";
  const url=URL.createObjectURL(new Blob([body],{type:"text/markdown"}));
  const a=el("a",{href:url,download:`MessageStats — ${safe} — ${stamp.slice(0,10)}.md`});
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function askPanel(A){
  const card = el("div",{class:"card"}, el("h2",{},"Ask"));
  const out = el("div",{});
  api("/api/ai").then(cfg=>{
    if(cfg.error){ card.append(el("div",{class:"flag warn"},el("div",{},el("b",{},"Assistant config problem: "),cfg.error))); return; }
    if(!cfg.configured){ card.append(setupForm(cfg)); return; }
    const q = el("input",{type:"text",placeholder:"Ask anything about this conversation…"});
    const scope = el("input",{type:"text",placeholder:"optional: also search for a word first"});
    const tone = el("select",{style:"max-width:170px"});
    for(const t of (cfg.tones??[])) tone.append(el("option",{value:t.id},t.label));
    tone.value = PREFS.get("aiTone") || "funny";
    tone.addEventListener("change",()=>PREFS.set("aiTone",tone.value));
    const run = async ()=>{
      if(!q.value.trim()) return;
      out.innerHTML=""; out.append(el("p",{class:"muted"},`Thinking (${cfg.model})…`));
      const t0=Date.now();
      try{
        const r = await fetch("/api/ai/ask",{method:"POST",headers:{"content-type":"application/json"},
          body:JSON.stringify({chatId:A.chat.id,merge:OPT.merge,ids:OPT.ids,question:q.value,
            search:scope.value||null,tone:tone.value})})
          .then(x=>x.json());
        if(r.error) throw new Error(r.error);
        out.innerHTML="";
        out.append(el("div",{class:"m-t",style:"white-space:pre-wrap"},r.answer));
        // A truncated answer ends mid-sentence and otherwise looks finished.
        if(r.truncated) out.append(el("div",{class:"flag warn"},el("div",{},
          el("b",{},"Cut off. "),"The model hit its length limit before finishing — ask for fewer people at a time, or a shorter format.")));
        const secs=((Date.now()-t0)/1000).toFixed(1);
        out.append(el("div",{class:"row",style:"margin-top:10px;align-items:center"},
          el("button",{class:"act",onclick:()=>saveAnswer(r,q.value,secs)},"Export"),
          el("span",{class:"sub"},

      }catch(e){ out.innerHTML=""; out.append(el("p",{class:"muted"},"Failed: "+esc(e.message))); }
    };
    q.addEventListener("keydown",e=>{if(e.key==="Enter")run();});
    card.append(
      el("p",{class:"sub"},
        cfg.local ? `Running on ${cfg.label} — nothing leaves this machine.`
                  : `Using ${cfg.label} (${cfg.model}). Statistics are sent to the provider; every request is logged to ai-sent.local.jsonl so you can check what left.`),
      el("div",{class:"row",style:"margin-bottom:8px"},q,scope,tone,el("button",{class:"act primary",onclick:run},"Ask")),
      el("div",{style:"margin-bottom:10px"},SUGGESTED.map(s=>
        el("span",{class:"chip",style:"cursor:pointer",onclick:()=>{q.value=s;run();}},s))),
      out);
  }).catch(()=>card.append(el("p",{class:"muted"},"Couldn't read assistant config.")));
  return card;
}

function searchPanel(A){

    const ms=Object.keys(r.byMonth).sort();

    el("div",{class:"row",style:"margin-bottom:10px"},q,who,from,to,el("button",{class:"act primary",onclick:run},"Search")),
    out);

  const peopleTable=(rows,cols)=>{

    box.append(card("The people you actually message",
      peopleTable(rows,["person","messages","you sent","they sent","first","latest"]),
      "One-to-one only, folded across split threads — an old SMS thread and a newer iMessage one count once, together. Click a row to open it."));

      const tr=el("tr",{class:"clickrow"},

  if(churn.length) m.append(el("div",{class:"flag warn"},el("div",{},
    el("b",{},`${churn.length} share a name with a differently-staffed thread. `),
    "Never merged automatically — a work group with staff churn looks identical to a chat that deliberately excludes someone.")));
  if(st.names.unnamed?.length){
    const big=st.names.unnamed.filter(u=>u.n>=50);
    if(big.length) m.append(el("div",{class:"flag warn"},el("div",{},
      el("b",{},`${big.length} senders have 50+ messages and no name. `),
      "They'll show up as phone numbers: ",big.slice(0,4).map(u=>`${u.handle} (${N(u.n)})`).join(", "),
      ". Add them to names.json by hand — if one of them is someone you know under another number, add an alias instead or they'll be counted as two people.")));
  }
  renderOverview(m,gen);
}

$("#ovbtn").addEventListener("click",()=>{ location.hash=""; boot(true); });
// Setting the hash fires hashchange, which renders — so only render directly
// when the hash is already #settings and no event will come. Doing both is
// what made the page render twice.
$("#setbtn").addEventListener("click",()=>{
  if(location.hash==="#settings") renderSettings(); else location.hash="settings";
});
// The app's Settings menu item navigates the web view to #settings rather than
// needing a JavaScript bridge into the sealed Swift binary.
addEventListener("hashchange",()=>{ if(location.hash==="#settings") renderSettings(); });
if(location.hash==="#settings"){
  // Still needs the chat list in the sidebar, so boot first, then swap the pane.
  boot(true).then(renderSettings);
} else boot();
</script>
