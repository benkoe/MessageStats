  }).catch(()=>card.append(el("p",{class:"muted"},"Couldn't read assistant config.")));
  return card;
}

const manualCard=()=>el("div",{class:"card"},
  el("h2",{},"Option B — copy it yourself"),
  el("ol",{class:"steps"},
    el("li",{},el("b",{},"Quit Messages"),
      el("div",{class:"sub"},"⌘Q, not just closing the window. Otherwise the newest messages sit unflushed in the write-ahead log and are silently missing.")),
    el("li",{},"In Finder press ⇧⌘G and go to ",el("code",{},"~/Library/Messages")),
    el("li",{},"Copy ",el("b",{},"all three")," files into ",
      el("code",{},"~/Library/Application Support/MessageStats/"),":",
      el("div",{class:"sub"},el("code",{},"chat.db"),"  ",el("code",{},"chat.db-wal"),"  ",el("code",{},"chat.db-shm"),
        el("div",{},"chat.db on its own opens fine and quietly omits your most recent history."))),
    el("li",{},"Come back and reload.")),
  el("div",{class:"row"},el("button",{class:"act primary",onclick:()=>boot()},"I've copied them — reload")));

const tile=(v,k,d)=>el("div",{class:"tile"},el("div",{class:"v"},v),el("div",{class:"k"},k),d?el("div",{class:"d"},d):null);
/* Cards cycle through the palette so a long report reads as distinct sections.
   Reset by resetCards() whenever a page is rebuilt, so colours stay stable
   rather than drifting each time you open a conversation. */
const CARD_ACCENTS=["--s1","--s3","--s2","--s7","--s5"];
let CARD_I=0;
const resetCards=()=>{CARD_I=0;};
const card=(title,body,sub)=>{
  const c=el("div",{class:"card"},el("h2",{},title),sub?el("p",{class:"sub"},sub):null,body);
  c.style.setProperty("--accent",`var(${CARD_ACCENTS[CARD_I++%CARD_ACCENTS.length]})`);
  return c;};
const legend=items=>el("div",{class:"legend"},items.map(({name,i})=>
  el("span",{},el("span",{class:"swatch",style:`background:${color(i)}`}),name)));

function personTable(P,A){
  const t=el("table",{},el("thead",{},el("tr",{},el("th",{},"person"),el("th",{},"total"),el("th",{},"share"),
    ...A.years.map(y=>el("th",{},String(y))))));
  const tb=el("tbody",{});
  P.forEach((p,i)=>tb.append(el("tr",{},
    el("td",{},el("span",{class:"swatch",style:`background:${color(i)}`}),p.who),
    el("td",{},N(p.n)),el("td",{},pct(p.n,A.total)),
    ...A.years.map(y=>el("td",{},N(p.byYear[y]??0))))));
  t.append(tb);
  return el("div",{class:"scroll",style:"margin-top:10px"},t);

/* ---------- search ---------- */
const SEARCH_PAGE=60;

/**
 * The filters are applied by the server, so results on screen that no longer
 * match the boxes above them are a lie — and that was the bug: typing a date
 * left the previous, unfiltered answer sitting there looking authoritative.
 * Every control re-runs the search, and the header states the range that was
 * actually applied.
 */
function searchPanel(A){
  const q=el("input",{type:"search",placeholder:"Search this conversation…"});
  const who=el("select",{},el("option",{value:""},"anyone"),...A.people.map(p=>el("option",{value:p},p)));
  const lo=D(A.first), hi=D(A.last);
  // min/max also constrain the native calendar, so it can't wander off into
  // years this conversation doesn't cover.
  const from=el("input",{type:"date",min:lo,max:hi,"aria-label":"From date"});
  const to=el("input",{type:"date",min:lo,max:hi,"aria-label":"To date"});
  const ctx=el("select",{"aria-label":"Lines of context"},
    el("option",{value:"0"},"no context"),el("option",{value:"2"},"± 2 lines"),
    el("option",{value:"5"},"± 5 lines"));
  ctx.value="2";

  const head=el("div",{}), out=el("div",{}), more=el("div",{});
  let seq=0, shown=0, needle="", lowest=Infinity;

  const clampDay=d=>d<lo?lo:d>hi?hi:d;
  const chips=[];
  const setRange=(f,t,btn)=>{
    from.value=f?clampDay(f):""; to.value=t?clampDay(t):"";
    for(const c of chips) c.setAttribute("aria-pressed",String(c===btn));
    if(q.value.trim()) run();
  };
  const chip=(label,f,t)=>{
    const b=el("button",{class:"chip",type:"button","aria-pressed":"false"},label);
    b.addEventListener("click",()=>setRange(f,t,b));
    chips.push(b); return b;
  };
  const ranges=el("div",{class:"row",style:"margin-bottom:10px"},
    el("span",{class:"muted",style:"font-size:12px"},"Jump to:"),
    chip("All time","",""),
    ...A.years.map(y=>chip(String(y),`${y}-01-01`,`${y}-12-31`)));
  chips[0].setAttribute("aria-pressed","true");
  // Hand-editing a date is a deliberate choice; drop the chip highlight so the
  // row never claims a range that isn't the one in the boxes.
  for(const d of [from,to]) d.addEventListener("input",()=>{
    for(const c of chips) c.setAttribute("aria-pressed","false");
  });

  const rangeNote=()=>{
    const bits=[];
    if(who.value) bits.push(who.value);
    if(from.value||to.value) bits.push(`${from.value||lo} → ${to.value||hi}`);
    return bits.length? ` · filtered to ${bits.join(", ")}` : "";
  };

  const render=(r,append)=>{
    if(!append){
      out.innerHTML=""; head.innerHTML=""; shown=0; lowest=Infinity;
      const people=Object.entries(r.byPerson||{}).sort((a,b)=>b[1]-a[1])
        .map(([k,v])=>`${k} ${N(v)}`).join(" · ");
      head.append(el("p",{class:"sub"},
        `${N(r.total)} matching messages${people?" · "+people:""}${rangeNote()}`));
      const ms=Object.keys(r.byMonth||{}).sort();
      if(ms.length>1) head.append(areaChart(ms,ms.map(k=>r.byMonth[k]),{h:110}));
    }
    // Two hits a line apart have overlapping context windows, so drawing each
    // one whole printed the same three messages twice — which is most of why
    // the list looked full of rows that don't contain the term. Lay the page
    // out by message index instead: each message drawn once, and hits whose
    // windows touch share one block. `h.i` indexes the conversation, so
    // context positions are h.i - before.length + k and h.i + 1 + k.
    const lines=new Map();
    for(const h of r.hits){
      h.before.forEach((b,k)=>{const i=h.i-h.before.length+k; if(!lines.has(i))lines.set(i,{m:b,hit:false});});
      h.after.forEach((a,k)=>{const i=h.i+1+k; if(!lines.has(i))lines.set(i,{m:a,hit:false});});
    }
    for(const h of r.hits) lines.set(h.i,{m:h,hit:true});   // a hit outranks context
    // Later pages are older, so anything at or above the last page's floor is
    // already on screen.
    const idx=[...lines.keys()].filter(i=>i<lowest).sort((a,b)=>a-b);
    if(idx.length) lowest=idx[0];
    const runs=[];
    for(const i of idx){
      const last=runs[runs.length-1];
      if(last && i===last[last.length-1]+1) last.push(i); else runs.push([i]);
    }
    for(const run of runs.reverse()){                        // newest block first
      const blk=el("div",{class:"hitblock"});
      for(const i of run){ const {m,hit}=lines.get(i); blk.append(msgEl(m,hit?"hit":"ctx",hit?needle:null)); }
      out.append(blk);
    }
    shown+=r.hits.length;
    more.innerHTML="";
    if(!r.total) out.append(el("p",{class:"muted"},"Nothing found."));
    // 60 of 455 with nothing saying so reads as "it found 60". Say so, and
    // give it somewhere to go.
    else if(r.hasMore) more.append(el("button",{class:"act",onclick:()=>run(true)},
      `Show ${SEARCH_PAGE} more — ${N(shown)} of ${N(r.total)} shown`));
    else if(r.total>SEARCH_PAGE) more.append(el("p",{class:"muted"},`All ${N(r.total)} shown.`));
  };

  async function run(append=false){
    const term=q.value.trim();
    if(!term){ head.innerHTML=""; out.innerHTML=""; more.innerHTML=""; shown=0; lowest=Infinity; return; }
    const my=++seq;                                  // a newer search wins
    if(append) more.innerHTML='<p class="muted">Loading…</p>';
    else { head.innerHTML='<p class="muted">Searching…</p>'; out.innerHTML=""; more.innerHTML=""; }
    const p=new URLSearchParams({q:term,limit:String(SEARCH_PAGE),
      offset:String(append?shown:0),context:ctx.value});
    if(OPT.merge)p.set("merge","1"); if(OPT.ids?.length)p.set("ids",OPT.ids.join(","));
    if(who.value)p.set("who",who.value); if(from.value)p.set("from",from.value); if(to.value)p.set("to",to.value);
    let r;
    try{ r=await api(`/api/chat/${A.chat.id}/search?${p}`); }
    catch(e){
      if(my!==seq) return;
      head.innerHTML=""; more.innerHTML="";
      out.innerHTML=""; out.append(el("p",{class:"muted"},`Search failed: ${e.message}`));
      return;
    }
    if(my!==seq) return;
    needle=term;
    render(r,append);
  }

  q.addEventListener("keydown",e=>{if(e.key==="Enter")run();});
  for(const c of [who,from,to,ctx]) c.addEventListener("change",()=>{ if(q.value.trim()) run(); });

  return el("div",{class:"card"},el("h2",{},"Search"),
    el("p",{class:"sub"},"Find any phrase and read it in context — the thing the terminal can't do without writing a throwaway script."),
    el("div",{class:"row",style:"margin:10px 0 8px"},q,who,from,to,ctx,
      el("button",{class:"act primary",onclick:()=>run()},"Search")),
    ranges, head, out, more);
}
/** Highlight every occurrence of the term. DOM nodes only — the text is
 *  somebody's message, and it never becomes markup. */
function markUp(text,needle){
  const frag=document.createDocumentFragment();
  const n=(needle||"").toLowerCase();
  if(!n){ frag.append(text); return frag; }
  const hay=text.toLowerCase();
  let i=0,j;
  while((j=hay.indexOf(n,i))!==-1){
    if(j>i) frag.append(text.slice(i,j));
    frag.append(el("mark",{},text.slice(j,j+n.length)));
    i=j+n.length;
  }
  frag.append(text.slice(i));
  return frag;
}
const msgEl=(m,cls,needle)=>el("div",{class:"msg "+(cls||"")},
  el("div",{class:"m-h"},`${m.who} · ${DT(m.ms)}`),
  el("div",{class:"m-t"}, needle? markUp(m.text,needle) : m.text));

/* ---------- settings ---------- */
async function renderSettings(){
  const m=$("#main"); m.innerHTML=""; const gen=newPage(); resetCards();
  CUR=null;
  for(const b of document.querySelectorAll(".chat")) b.setAttribute("aria-current","false");
  m.append(el("h1",{},"Settings"));

  const st = await api("/api/status").catch(()=>null);
  // Two renders used to race here and each append its own copy of every card,
  // so the page came out doubled. Whoever is newest wins; see newPage().
  if(gen!==PAGE) return;

  /* --- data --- */
  const data = card("Your data", null,
    `Everything lives in ${st?.dirs?.data ?? "~/Library/Application Support/MessageStats"} — outside the app, so updates never touch it.`);
  if(st?.db?.found){
    data.append(el("div",{class:"tiles"},
      tile(`${N(st.db.sizeMB)} MB`,"database", st.db.wal? "WAL present ✓":"no -wal file"),
      tile(st.db.ageHours==null?"—":(st.db.ageHours<24? st.db.ageHours.toFixed(0)+"h":Math.round(st.db.ageHours/24)+"d"),
        "since the newest message", st.db.newest? D(st.db.newest):null),
      tile(N(st.names.count),"names known",
        st.names.unnamedTotal? `${N(st.names.unnamedTotal)} handles unnamed`:null)));
  } else {
    data.append(el("p",{class:"sub"},"No database imported yet."));
  }
  data.append(el("div",{class:"row"},
    el("button",{class:"act primary",onclick:()=>renderSetup(st,{refresh:true})},"Re-import or re-read Contacts")));
  m.append(data);

  /* --- reading --- */
  const auto = el("input",{type:"checkbox"});
  auto.checked = PREFS.get("combineThreads");
  // Both halves matter: the sidebar folds the threads into one row and the
  // report opens merged. Splitting them would let the list promise a total the
  // report does not show.
  // Reload the sidebar in place — boot() here would throw the Settings page
  // away as a side effect of ticking a box on it.
  auto.addEventListener("change",()=>{ PREFS.set("combineThreads",auto.checked); loadChats(); });
  const label = el("label",{style:"display:flex;gap:9px;align-items:flex-start;cursor:pointer"},
    auto, el("span",{},el("b",{},"Show split threads as one conversation"),
      el("div",{class:"sub"},"One sidebar entry per conversation rather than per chat row, opened with its sibling threads folded in — same people, or the same group recreated, renamed, or forked to SMS. Turn this off to see the raw chat rows.")));
  const read = card("Reading conversations", label);
  read.append(el("div",{class:"flag info"},el("div",{},
    el("b",{},"Threads that share a name but not a roster are never merged automatically. "),
    "A work group where people join and leave looks identical to a chat that deliberately excludes someone, and merging the second kind credits the excluded person with none of hundreds of messages they were never party to. Those stay a per-conversation decision.")));
  m.append(read);

  /* --- assistant --- */
  const ai = card("Assistant", el("p",{class:"muted"},"Loading…"),
    "Off by default. The only feature that can send anything off this machine.");
  m.append(ai);
  api("/api/ai").then(cfg=>{
    ai.querySelector(".muted")?.remove();
    if(cfg.configured){
      ai.append(el("p",{class:"sub"},
        cfg.local? `Running on ${cfg.label} — nothing leaves this machine.`
                 : `Using ${cfg.label} (${cfg.model}). Statistics for the open conversation are sent when you ask a question; every request is logged to ai-sent.local.jsonl.`));
      const swap = el("button",{class:"act"},"Change provider or model");
      const off  = el("button",{class:"act"},"Turn off and forget the key");
      const slot = el("div",{});
      swap.addEventListener("click",()=>{ swap.disabled=true; slot.append(setupForm(cfg)); });
      off.addEventListener("click",async ()=>{
        off.disabled=true; off.textContent="Removing…";
        await fetch("/api/ai/config",{method:"POST",headers:{"content-type":"application/json"},
          body:JSON.stringify({clear:true})});
        location.reload();
      });
      ai.append(el("div",{class:"row"},swap,off),slot);
    } else {
      ai.append(setupForm(cfg));
    }
  }).catch(()=>ai.append(el("p",{class:"muted"},"Couldn't read the assistant config.")));

  /* --- unnamed numbers --- */
  if(st?.names?.unnamed?.length){
    const nc = card("Put names to numbers",null,
      `${N(st.names.unnamedTotal)} handles in your chats have no name, busiest first. A report full of phone numbers is much worse than one with names, and Contacts can't help with numbers it doesn't have.`
      // Businesses name themselves from their chat row and shortcodes are gone
      // entirely, so this list is people — say so, or the shorter list reads
      // as something having been lost.
      +` Automated senders are left out, and Apple Messages for Business handles name themselves.`);
    nc.append(el("div",{class:"flag info"},el("div",{},
      el("b",{},"If it's someone you already know under another number, pick them from the list instead. "),
      "Naming it separately counts one person twice, with half their history each — every stat about them is then wrong.")));
    const rows=el("div",{});
    nc.append(rows);
    m.append(nc);
    api("/api/names").then(({known})=>{
      if(gen!==PAGE) return;
      for(const u of st.names.unnamed){
        const input=el("input",{type:"text",placeholder:"Name",style:"max-width:200px"});
        const same=el("select",{style:"max-width:190px"},el("option",{value:""},"…or same person as"));
        for(const k of known) same.append(el("option",{value:k.handle},k.name));
        const note=el("span",{class:"sub"});
        const save=el("button",{class:"act",onclick:async ()=>{
          const body = same.value ? {handle:u.handle,aliasOf:same.value}
                                  : {handle:u.handle,name:input.value.trim()};
          if(!same.value && !body.name){ note.textContent="Type a name, or pick who they are."; return; }
          save.disabled=true; note.textContent="Saving…";
          try{
            const r=await fetch("/api/names",{method:"POST",headers:{"content-type":"application/json"},
              body:JSON.stringify(body)}).then(x=>x.json());
            if(!r.ok) throw new Error(r.error||"could not save");
            note.textContent = same.value
              ? `Folded into ${same.options[same.selectedIndex].text}.`
              : `Saved as ${body.name}.`;
            input.disabled=same.disabled=true;
          }catch(e){ note.textContent="Failed: "+e.message; save.disabled=false; }
        }},"Save");
        rows.append(el("div",{class:"row",style:"margin:6px 0;align-items:center;flex-wrap:wrap"},
          el("code",{style:"min-width:150px"},u.handle),
          el("span",{class:"sub",style:"min-width:74px"},`${N(u.n)} msgs`),
          input,same,save,note));
      }
      rows.append(el("p",{class:"sub",style:"margin-top:8px"},
        "Reload a conversation to see the new names — they're written straight to names.json."));
    }).catch(()=>{ if(gen===PAGE) rows.append(el("p",{class:"muted"},"Couldn't read the name list.")); });
  }

  /* --- assistant history --- */
  const histCard = card("Assistant history", el("p",{class:"muted"},"Loading…"),
    "Every answer, kept in ai-history.local.json beside your database so you can reread one later. It quotes your conversations, so it never leaves this machine — and you can delete the lot here.");
  m.append(histCard);
  api("/api/ai/history").then(h=>{
    if(gen!==PAGE) return;
    histCard.querySelector(".muted")?.remove();
    if(!h.total){ histCard.append(el("p",{class:"sub"},"Nothing saved yet.")); return; }
    const list=el("div",{class:"sub"});
    for(const e of h.entries.slice(0,12)){
      list.append(el("div",{style:"padding:4px 0;border-bottom:1px solid var(--grid)"},
        el("b",{},e.chat||"—"),` — ${e.question}`,
        el("div",{},`${D(Date.parse(e.at))} · ${e.toneLabel??e.tone??"—"} · ${e.model}`)));
    }
    const note=el("span",{class:"sub"});
    const clear=el("button",{class:"act",onclick:async ()=>{
      // Deleting someone's saved answers is not undoable — ask once.
      if(!clear.dataset.armed){ clear.dataset.armed="1"; clear.textContent="Delete all — click again"; return; }
      clear.disabled=true;
      try{
        const r=await fetch("/api/ai/history/clear",{method:"POST"}).then(x=>x.json());
        if(!r.ok) throw new Error("could not clear it");
        list.innerHTML=""; note.textContent="Deleted."; clear.textContent="Clear history";
      }catch(err){ note.textContent="Couldn't clear: "+err.message; clear.disabled=false; }
    }},"Clear history");
    histCard.append(
      el("p",{class:"sub"},`${N(h.total)} saved${h.total>12?" — showing the 12 most recent":""}.`),
      list, el("div",{class:"row",style:"margin-top:10px;align-items:center"},clear,note));
  }).catch(()=>{ if(gen===PAGE) histCard.append(el("p",{class:"muted"},"Couldn't read the history.")); });

  /* --- about --- */
  m.append(card("About",el("div",{class:"sub"},
    el("div",{},"Data folder: ",el("code",{},st?.dirs?.data ?? "~/Library/Application Support/MessageStats")),
    el("div",{style:"margin-top:6px"},"Code folder: ",el("code",{},st?.dirs?.code ?? "~/Library/Application Support/MessageStats/app")),
    el("div",{style:"margin-top:6px"},"The app updates itself from the repo every time it launches."))));
}

/* ---------- overview: the whole library at once ---------- */

/**
 * Appended asynchronously rather than awaited, because it scans every message
 * row and takes a couple of seconds the first time. The landing page and its
 * warnings render immediately; this drops in underneath when it's ready.
 */
async function renderOverview(mount,gen){
  const box=el("div",{});
  mount.append(box);
  box.append(el("p",{class:"muted"},"Adding up every conversation…"));
  let O;
  try{ O=await api("/api/overview"); }
  catch(e){
    if(gen===PAGE) box.replaceChildren(el("p",{class:"muted"},"Couldn't build the overview: "+esc(e.message)));
    return;
  }
  if(gen!==PAGE){ box.remove(); return; }   // they opened something else meanwhile
  if(!O){ box.remove(); return; }
  box.replaceChildren();

  box.append(el("h2",{style:"margin-top:18px"},"Everything, all at once"));
  box.append(el("div",{class:"tiles"},
    tile(N(O.total),"messages ever",`${N(O.sent)} sent · ${N(O.received)} received`),
    tile(N(O.chats),"conversations",`since ${D(O.first)}`),
    tile(N(O.activeDays),"days with a message",
      O.activeDays>=O.spanDays? "every single day" : `out of ${N(O.spanDays)}`),
    tile(O.perDay.toFixed(0),"a day, average",
      O.busiestDay?`busiest was ${O.busiestDay.day} — ${N(O.busiestDay.n)}`:null)));

  const yrs=Object.keys(O.byYear);
  if(yrs.length>1){
    const c=card("Sent and received, by year",lineChart(yrs,[
      {name:"received",values:yrs.map(y=>O.byYear[y].received)},
      {name:"sent",values:yrs.map(y=>O.byYear[y].sent)}],{yLabel:"messages per year"}),
      "The gap between the two lines is how much more you get than you send.");
    c.append(legend([{name:"received",i:0},{name:"sent",i:1}]));
    box.append(c);
  }

  const peopleTable=(rows,cols)=>{
    const t=el("table",{},el("thead",{},el("tr",{},...cols.map(c=>el("th",{},c)))));
    t.append(el("tbody",{},...rows));
    return el("div",{class:"scroll"},t);
  };

  if(O.people.length){
    const rows=O.people.map(p=>{
      const tr=el("tr",{class:"clickrow"},
        el("td",{},p.name),el("td",{},N(p.n)),el("td",{},N(p.sent)),el("td",{},N(p.received)),
        el("td",{},D(p.first)),el("td",{},D(p.last)));
      if(p.chats.length) tr.addEventListener("click",()=>openChat(p.chats[0]));
      return tr;
    });
    box.append(card("The people you actually message",
      peopleTable(rows,["person","messages","you sent","they sent","first","latest"]),
      "One-to-one only, folded across split threads — an old SMS thread and a newer iMessage one count once, together. Click a row to open it."));
  }

  if(O.groups.length){
    const rows=O.groups.map(g=>{
      const tr=el("tr",{class:"clickrow"},
        el("td",{},g.name),el("td",{},N(g.n)),el("td",{},N(g.people.length)),
        el("td",{},D(g.first)),el("td",{},D(g.last)));
      tr.addEventListener("click",()=>openChat(g.id));
      return tr;
    });
    box.append(card("Groups",peopleTable(rows,["group","messages","people","first","latest"]),
      "Click a row to open it."));
  }

  if(O.fading.length){
    const rows=O.fading.map(f=>el("tr",{},
      el("td",{},f.name),el("td",{},N(f.prior)),el("td",{},N(f.recent)),
      el("td",{style:`color:${f.change<-0.5?"var(--crit)":"inherit"}`},
        (f.change*100).toFixed(0)+"%")));
    box.append(card("Drifting apart",
      peopleTable(rows,["person","12–24 months ago","last 12 months","change"]),
      "Two equal twelve-month windows, so a partial current year can't make everyone look like they're fading."));
  }

  if(O.drifted.length){
    box.append(card("Gone quiet",
      el("div",{},O.drifted.map(d=>el("span",{class:"chip"},
        `${d.name} · ${N(d.n)} messages · silent ${Math.round(d.quietDays/30)} months`))),
      "Conversations with real history behind them and nothing for six months or more."));
  }

  if(O.behind?.length){
    const rows=O.behind.map(b=>el("tr",{},
      el("td",{},b.name),el("td",{},N(b.n)),el("td",{},D(b.since)),el("td",{},D(b.last))));
    box.append(card("Never got back to them",
      peopleTable(rows,["conversation","unread","read up to","last message"]),
      "Messages that arrived after the last one you read. The read mark can predate this copy of the database — a pointer that survived a device migration — so \"read up to\" is sometimes older than anything here."));
  }
}

/* ---------- boot ---------- */
async function boot(skipSetup){
  const st=await api("/api/status");
  // The age in the header is the only place staleness surfaces, so it is also
  // the way back to the setup screen — otherwise it reports a problem the UI
  // gives you no way to act on.
  const sub=$("#brand-sub");
  sub.textContent = st.db.ageHours!=null
    ? (st.db.ageHours<24? st.db.ageHours.toFixed(0)+"h old" : Math.round(st.db.ageHours/24)+"d old") : "local only";
  sub.title = "Re-copy the snapshot or re-read Contacts";
  sub.onclick = () => renderSetup(st,{refresh:true});
  if(!st.ready || (!skipSetup && (!st.names.found || st.names.count===0))) return renderSetup(st);
  await loadChats();
  const m=$("#main"); m.innerHTML=""; resetCards();
  const gen=newPage();
  CUR=null;
  for(const b of document.querySelectorAll(".chat")) b.setAttribute("aria-current","false");
  m.append(el("h1",{},"Your messages"));
  m.append(el("p",{class:"sub"},`${N(CHATS.length)} conversations with 200+ messages in the sidebar. Everything runs locally; nothing is uploaded.`));
  const combined=CHATS.filter(c=>c.combined), split=CHATS.filter(c=>c.siblings.length);
  const churn=CHATS.filter(c=>pendingNamed(c).length);
  if(combined.length) m.append(el("div",{class:"flag info"},el("div",{},
    el("b",{},`${combined.length} conversations occupy more than one chat row. `),
    "Same people, different chat_identifier — a recreated group, a rename, or an SMS fork. They are listed and read as one; turn that off in Settings to see the raw rows.")));
  if(split.length) m.append(el("div",{class:"flag warn"},el("div",{},
    el("b",{},`${split.length} conversations are split across several chat rows. `),
    "Same people, different chat_identifier — a recreated group, a rename, or an SMS fork. Open one and press Merge, or you'll be reading part of the history.")));
  if(churn.length) m.append(el("div",{class:"flag warn"},el("div",{},
    el("b",{},`${churn.length} share a name with a differently-staffed thread. `),
    "Never merged automatically — a work group with staff churn looks identical to a chat that deliberately excludes someone. Open one and answer the question at the top.")));
  if(st.names.unnamed?.length){
    const big=st.names.unnamed.filter(u=>u.n>=50);
    if(big.length) m.append(el("div",{class:"flag warn"},el("div",{},
      el("b",{},`${big.length} senders have 50+ messages and no name. `),
      "They'll show up as phone numbers: ",big.slice(0,4).map(u=>`${u.handle} (${N(u.n)})`).join(", "),
      ". Add them to names.json by hand — if one of them is someone you know under another number, add an alias instead or they'll be counted as two people.")));
  }
  renderOverview(m,gen);
}

$("#ovbtn").addEventListener("click",()=>{ location.hash=""; boot(true); });
// Setting the hash fires hashchange, which renders — so only render directly
// when the hash is already #settings and no event will come. Doing both is
// what made the page render twice.
$("#setbtn").addEventListener("click",()=>{
  if(location.hash==="#settings") renderSettings(); else location.hash="settings";
});
// The app's Settings menu item navigates the web view to #settings rather than
// needing a JavaScript bridge into the sealed Swift binary.
addEventListener("hashchange",()=>{ if(location.hash==="#settings") renderSettings(); });
// Merge decisions must be in hand before any conversation opens, or the first
// chat of the session ignores them.
loadMerges().then(()=>{
  if(location.hash==="#settings"){
    // Still needs the chat list in the sidebar, so boot first, then swap the pane.
    boot(true).then(renderSettings);
  } else boot();
});
